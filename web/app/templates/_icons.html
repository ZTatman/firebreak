{# Stroke icons in one consistent style. Usage:
   {% call icon("text-success") %}<path d="..." />{% endcall %} #}
{% macro icon(class="", size=16) -%}
  <svg class="{{ class }}"
       width="{{ size }}"
       height="{{ size }}"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
       aria-hidden="true">
    {{ caller() }}
  </svg>
{%- endmacro %}
