[project]
name = "firebreak-web"
version = "0.1.0"
description = "Firebreak: FastAPI + HTMX web interface for managing Forgejo repositories"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "cryptography>=48.0.1",
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.0",
    "jinja2-fragments>=0.1.0",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.2",
    "python-multipart>=0.0.31",
    "sqlalchemy[asyncio]>=2.0.49",
]

[dependency-groups]
dev = [
    "djlint>=1.36.1",
    "mypy>=1.19.0",
    "ruff>=0.11.0",
    "uvicorn[standard]>=0.44.0",
]

[tool.mypy]
python_version = "3.13"
files = ["app"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true

[tool.djlint]
indent = 2
profile = "jinja"
max_line_length = 100
extension = "html"

[tool.ruff]
target-version = "py313"
line-length = 88
