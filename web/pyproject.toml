[project]
name = "firebreak-web"
version = "0.1.0"
description = "Firebreak: FastAPI + HTMX web interface for managing Forgejo repositories"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jinja2-fragments>=1.12.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
]

[dependency-groups]
dev = [
    "djlint>=1.46.1",
    "mypy>=2.3.1",
    "ruff>=0.16.7",
    "uvicorn[standard]>=0.52.4",
]

[tool.mypy]
python_version = "3.13"
files = ["app"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true

[tool.djlint]
indent = 2
profile = "jinja"
max_line_length = 100
extension = "html"

[tool.ruff]
target-version = "py313"
line-length = 88
